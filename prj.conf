CONFIG_SPI_NRFX=y

CONFIG_ARM_MPU=n

CONFIG_HW_STACK_PROTECTION=n

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PWM=y
# adc is just for modules
CONFIG_ADC=y
CONFIG_ADC_ASYNC=y
# i2c is just for modules
CONFIG_I2C=y
# eeprom is just for modules
CONFIG_EEPROM=y
# flash is just for modules
CONFIG_FLASH=y

CONFIG_REBOOT=y

CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_DISK_DRIVER_SDMMC=y

# this stuff needs to increase for SD card
CONFIG_MAIN_STACK_SIZE=8096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# usb / console
CONFIG_USB_DEVICE_STACK_NEXT=y

#CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=n
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y

CONFIG_SAMPLE_USBD_PID=0x0001
CONFIG_SAMPLE_USBD_PRODUCT="Furrydex"
CONFIG_SAMPLE_USBD_MANUFACTURER="Macroplastics"

CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1

CONFIG_UDC_BUF_COUNT=32
# 8192 might be too high
CONFIG_UDC_BUF_POOL_SIZE=8192
# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

CONFIG_SHELL=y
# this stuff is probably not needed and should probably be removed in production firmware, but it is so cool!!
# i think sched(uler) is for multi-core cpus
# CONFIG_SCHED_CPU_MASK=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_KERNEL_SHELL=y
CONFIG_STATS=y
CONFIG_STATS_SHELL=y

# lua stuff
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_NEWLIB_LIBC_FLOAT_SCANF=y
CONFIG_POSIX_API=y

CONFIG_ENTROPY_GENERATOR=y
CONFIG_THREAD_NAME=y



### RTT ###
# Enable RTT driver
CONFIG_USE_SEGGER_RTT=y

# Redirect the console and printk to RTT
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Optional: Enable the logger module with RTT backend
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y

# Stop the boot loop on crash so you can read the error
CONFIG_RESET_ON_FATAL_ERROR=n